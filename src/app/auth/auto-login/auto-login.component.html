<div class="modal fade" id="clientSetupModal" tabindex="-1" role="dialog" aria-labelledby="clientSetupModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="clientSetupModalLabel">Disclaimer</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <p style="white-space: pre-line;">
          {{disclaimer}}
        </p>
      </div>

      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-danger" (click)="onDisagree()">Disagree</button>
        <button type="button" class="btn btn-success" (click)="onAgree()">Agree</button>
      </div>
    </div>
  </div>
</div>
