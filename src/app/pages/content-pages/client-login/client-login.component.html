<!-- Start wrapper-->
<div id="wrapper">
    <header class="topbar-nav">
        <nav class="navbar navbar-expand ">
            <div class="brand-logo d-flex">
                <img src="assets/images/logo-icon.png" class="logo-icon" alt="Indus Technology Logo" style="max-height: 40px; object-fit: contain;">
                <h5 class="logo-text ml-2">Indus Technology</h5>  
            </div>
            <div class="toggle-menu"> <i class="zmdi zmdi-menu"></i>
            </div>
            <ul class="navbar-nav align-items-center right-nav-link ml-auto">
                <li class="nav-item">
                    <a [routerLink]="['/auth/signin']" (click)="Logout()"><li><i class="zmdi zmdi-power mr-3"></i>Logout</li></a>
                </li>
            </ul>
        </nav>
    </header>
	<div class="d-flex align-items-center justify-content-center">
		<div class="container">
			<div class="row mt-5 pt-5">
				<div class="col-md-12 mt-5 pt-5">
					<div class="text-center mt-2">
						<form  #clientLoginForm="ngForm" class="form-inline justify-content-center py-4">
							<div class="input-group">
                                <!-- <span><h1 class="title mr-2">Client</h1></span> -->
                                <div class="form-group">        
                                    <label for="clientName">Client<i class="validation_required">*</i></label>
                                    <ng-select 
                                        [items]="clientDataArr"
                                        bindLabel="clientName"
                                        bindValue="id"
                                        placeholder="Select Client Name"  
                                        appendTo="body"
                                        (change)="GotoDispatchPage($event.id,$event.clientName)"
                                        name="clientName"
                                        [(ngModel)]="cForm.clientId"> 
                                    </ng-select>
                                </div>
                                <!-- <div *ngIf="!cForm?.valid && (cForm?.dirty || cForm?.touched)" class="error">
                                    <div *ngIf="cForm.errors.required">
                                       please Select Client
                                    </div>
                                </div>  -->
								<!-- <div class="button-group ml-2">
									<button class="btn btn-primary" type="submit" (click)="GotoDispatchPage()" [disabled]="!clientLoginForm.valid" >Enter</button>
								</div> -->
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div> 
</div>
<!--wrapper-->
