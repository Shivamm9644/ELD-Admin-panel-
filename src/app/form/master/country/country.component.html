
<div class="row">
	<div class="col-lg-12">
		<div class="card">
			<form action="#"> 
				<div class="card-body">
					<div class="btn-group float-sm-right mb-1">
						<button type="button" data-toggle="modal" (click)="ClearForm()" data-target="#country_modal" class="btn btn-outline-success btn-sm">
							<i class="zmdi zmdi-plus mr-1"></i>Add Country
						</button>
					</div>
					<div class="table-responsive">
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
							<thead>
								<tr>
									<th>S.No</th>
									<th>Country Code</th>
									<th>Country Name</th>
									<th>Lattitude</th>
									<th>Longitude</th>
									<!-- <th>Action</th>   -->
								</tr>
							</thead>
							<tbody>
								<!-- <div id="loading" *ngIf="isLoading">
									<img src="assets/images/pre_lodding.gif" width="250" height="250"  class="text-center">
							   </div> -->
							   <tr *ngFor="let country of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td><a style="color: dodgerblue; cursor: pointer;" data-toggle="modal" data-target="#country_modal" (click)="EditCountry(country.countryId)">{{country.countryCode}}</a></td>
								<!-- <td>{{country.countryCode}} </td> -->
								<td>{{country.countryName}}</td>   
								<td>{{country.lattitude}}</td>
								<td>{{country.longitude}}</td>
								<!-- <td><a style="cursor: pointer; color: dodgerblue; text-align: center;" data-toggle="modal" data-target="#country_modal" (click)="EditCountry(country)">
									<i class="fa fa-pencil fa-lg" aria-hidden="true"></i>
								</a>
								</td>  -->
							</tr>
							</tbody>
						</table>
						<div class="pre_lodding" *ngIf="isLoading">
							<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
						</div>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>
<div id="country_modal" class="modal fade hide" role="dialog">
    <form action="#" #masterCountryForm="ngForm" >
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title">Country Details</h6>
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
				<div class="modal-body">
					<div class="form-body">
						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">Country Code<i class="validation_required">*</i></label>
									<input type="text" id="countryCode" name="countryCode" required #countryCode="ngModel"  class="form-control form-control-sm" [(ngModel)]="countryForm.countryCode" placeholder="Country Code">
								</div>
								<div *ngIf="!countryCode?.valid && (countryCode?.dirty || countryCode?.touched)" class="error">
									<div *ngIf="countryCode.errors.required">
										Country code is  required
									</div>
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">Country Name<i class="validation_required">*</i></label>
									<input type="text" id="countryName" name="countryName" required #countryName="ngModel"  class="form-control form-control-sm" [(ngModel)]="countryForm.countryName" placeholder="Country Name">
								</div>
								<div *ngIf="!countryName?.valid && (countryName?.dirty || countryName?.touched)" class="error">
									<div *ngIf="countryName.errors.required">
										Country name is required
									</div>
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">Lattitude<i class="validation_required">*</i></label>
									<input type="text" id="lattitude" name="lattitude" required #lattitude="ngModel"  class="form-control form-control-sm" [(ngModel)]="countryForm.lattitude" placeholder="">
								</div>
								<div *ngIf="!lattitude?.valid && (lattitude?.dirty || lattitude?.touched)" class="error">
									<div *ngIf="lattitude.errors.required">
										Lattitude is required.
									</div>
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">Longitude<i class="validation_required">*</i></label>
									<input type="text" id="longitude" name="longitude" required #longitude="ngModel"  class="form-control form-control-sm" [(ngModel)]="countryForm.longitude" placeholder="">
								</div>
								<div *ngIf="!longitude?.valid && (longitude?.dirty || longitude?.touched)" class="error">
									<div *ngIf="longitude.errors.required">
										Longitude is  required
									</div>
								</div>
							</div>
							<!-- <div class="col-md-6">
								<div class="form-group">
									<label for="clientName" class="control-label">Client<i class="validation_required">*</i></label>
									<ng-select 
										[items]="clientDataArr"
										bindLabel="clientName"
										bindValue="id"
										placeholder="Select Client"
										appendTo="body"
										name="clientName"
										required #clientId="ngModel"
										[(ngModel)]="countryForm.clientId"> 
                                    </ng-select>
									<div *ngIf="!clientId?.valid && (clientId?.dirty || clientId?.touched)" class="error">
										<div *ngIf="clientId.errors.required">
											Client is required
										</div>
									</div>
								</div>
							</div> -->
						</div>						
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-primary" *ngIf="!isEditMode && !isViewMode" [disabled]="!masterCountryForm.valid" data-dismiss="modal" (click)="SaveCountry()">Save</button>
                    <button type="submit" class="btn btn-primary" *ngIf="isEditMode && !isViewMode" [disabled]="!masterCountryForm.valid" data-dismiss="modal" (click)="UpdateCountry()">Update</button>
					<button type="button" class="btn btn-danger" *ngIf="isEditMode && !isViewMode"  data-dismiss="modal" (click)="DeleteCountry()">Delete</button>
				</div>
			</div>
		</div>
	</form>
</div>
