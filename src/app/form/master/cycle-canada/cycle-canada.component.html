
<div class="row">
	<div class="col-lg-12">
		<div class="card">
			<form action="#"> 
				<div class="card-body">
					<div class="btn-group float-sm-right mb-1">
						<button type="button"  data-toggle="modal" (click)="ClearForm()" data-target="#cycle_canada_modal" class="btn btn-outline-success btn-sm">
							<i class="zmdi zmdi-plus mr-1"></i>Add Cycle Canada
						</button>
					</div>
					<div class="table-responsive">
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
							<thead>
								<tr>
									<th>S.No</th>
									<th>Cycle Canada</th>
									<th>Country</th>
									<th>State</th>  
								</tr>
							</thead>
							<tbody>
								<!-- <div id="loading" *ngIf="isLoading">
									<img src="assets/images/pre_lodding.gif" width="250" height="250"  class="text-center">
							   </div> -->
							   <tr *ngFor="let cycleCanada of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td><a style="color: dodgerblue; cursor: pointer;" data-toggle="modal" data-target="#cycle_canada_modal" (click)="EditCycleCanada(cycleCanada.cycleCanadaId)">{{cycleCanada.cycleCanadaName}}</a></td>
								<td>{{cycleCanada.countryId}} </td>
								<td>{{cycleCanada.stateId}} </td>
								<!-- <td>{{cycleCanada.cycleCanadaName}} </td> -->
							</tr>
							</tbody>
						</table>
						<div class="pre_lodding" *ngIf="isLoading">
							<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
						</div>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>
<div id="cycle_canada_modal" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
    <form action="#" #masterCyclecanadaForm="ngForm">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header" >
					<h6 class="modal-title">Cycle Canada</h6>
					<button type="button" class="close"   data-dismiss="modal">&times;</button>
				</div>
				<div class="modal-body">
					<div class="form-body">
						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<label for="countryName" class="control-label">Country<i class="validation_required">*</i></label>
									<ng-select [items]="countryDataArr"
                                        bindLabel="countryName"
                                        bindValue="id"
                                        placeholder="Select Country"
                                        appendTo="body"
                                        name="countryName"
										required #countryId="ngModel"
                                        [(ngModel)]="cycleCanadaForm.countryId"> 
                                    </ng-select>
									<div *ngIf="!countryId?.valid && (countryId?.dirty || countryId?.touched)" class="error">
										<div *ngIf="countryId.errors.required">
											Country name is required
										</div>
									</div>
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label for="stateName" class="control-label">State<i class="validation_required">*</i></label>
									<ng-select [items]="stateDataArr"
                                        bindLabel="stateName"
                                        bindValue="id"
                                        placeholder="Select state"
                                        appendTo="body"
                                        name="stateName"
										required #stateId="ngModel"
                                        [(ngModel)]="cycleCanadaForm.stateId"> 
                                    </ng-select>
									<div *ngIf="!stateId?.valid && (stateId?.dirty || stateId?.touched)" class="error">
										<div *ngIf="stateId.errors.required">
											State Name is required
										</div>
									</div>
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">Cycle Canada Name<i class="validation_required">*</i></label>
									<input type="text" id="cycleCanadaName" name="cycleCanadaName"  required #cycleCanadaName="ngModel" class="form-control form-control-sm" [(ngModel)]="cycleCanadaForm.cycleCanadaName" placeholder="Cycle Canada Name">
								</div>
								<div *ngIf="!cycleCanadaName?.valid && (cycleCanadaName?.dirty || cycleCanadaName?.touched)" class="error">
									<div *ngIf="cycleCanadaName.errors.required">
										Cycle Canada Name is required
									</div>
								</div>
							</div>
							<!-- <div class="col-md-6">
								<div class="form-group">
									<label for="clientName" class="control-label">Client<i class="validation_required">*</i></label>
									<ng-select 
										[items]="clientDataArr"
										bindLabel="clientName"
										bindValue="id"
										placeholder="Select Client"
										appendTo="body"
										name="clientName"
										required #clientId="ngModel"
										[(ngModel)]="cycleCanadaForm.clientId"> 
                                    </ng-select>
									<div *ngIf="!clientId?.valid && (clientId?.dirty || clientId?.touched)" class="error">
										<div *ngIf="clientId.errors.required">
											Client is required
										</div>
									</div>
								</div>
							</div> -->
						</div>						
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger" data-dismiss="modal" >Cancel</button>
					<button type="submit" class="btn btn-primary" *ngIf="!isEditMode && !isViewMode" [disabled]="!masterCyclecanadaForm.valid" data-dismiss="modal" (click)="SaveCycleCanada()">Save</button>
					<button type="submit" class="btn btn-primary" *ngIf="isEditMode && !isViewMode" [disabled]="!masterCyclecanadaForm.valid" data-dismiss="modal" (click)="UpdateCycleCanada()">Update</button>
					<button type="button" class="btn btn-danger" *ngIf="isEditMode && !isViewMode"  data-dismiss="modal" (click)="DeleteCycleCanada()">Delete</button>
				</div>
			</div>
		</div>
	</form>
</div>
