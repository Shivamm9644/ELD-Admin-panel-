<div class="row">
	<div class="col-lg-12">
		<div class="card">
			<form action="#"> 
				<div class="card-body">
					<div class="btn-group float-sm-right mb-1">
						<button type="button" data-toggle="modal" (click)="ClearForm()" data-target="#vehicle_condition_modal" class="btn btn-outline-success btn-sm">
							<i class="zmdi zmdi-plus mr-1"></i>Add Vehicle Condition
						</button>
					</div>
					<div class="table-responsive">
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
							<thead>
								<tr>
									<th>S.No</th>
									<th>Vehicle Condition</th>
								</tr>
							</thead>
							<tbody>
								<!-- <div id="loading" *ngIf="isLoading">
									<img src="assets/images/pre_lodding.gif" width="250" height="250"  class="text-center">
							   </div> -->
							   <tr *ngFor="let vc of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td><a style="color: dodgerblue; cursor: pointer;" data-toggle="modal" data-target="#vehicle_condition_modal" (click)="EditVehicleCondition(vc.vehicleConditionId)">{{vc.vehicleConditionName}}</a></td>
							</tr>
							</tbody>
						</table>
						<div class="pre_lodding" *ngIf="isLoading">
							<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
						</div>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>
<div id="vehicle_condition_modal" class="modal fade hide" role="dialog">
	<form action="#" #vehicleConditionMasterForm="ngForm">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title">Vehicle Condition Details</h6>
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
				<div class="modal-body">
					<div class="form-body">
						<div class="row">
							<div class="col-md-12">
								<div class="form-group">
									<label class="control-label">Vehicle Condition Name<i class="validation_required">*</i></label>
									<input type="text" id="vehicleConditionName" name="vehicleConditionName"  required #vehicleConditionName="ngModel" class="form-control form-control-sm" [(ngModel)]="vehicleConditionForm.vehicleConditionName" placeholder="Vehicle Condition Name">
								</div>
								<div *ngIf="!vehicleConditionName?.valid && (vehicleConditionName?.dirty || vehicleConditionName?.touched)" class="error">
									<div *ngIf="vehicleConditionName.errors.required">
										Vehicle Condition Name is required
									</div>
								</div>
							</div>
							<!-- <div class="col-md-6">
								<div class="form-group">
									<label for="clientName" class="control-label">Client<i class="validation_required">*</i></label>
									<ng-select 
										[items]="clientDataArr"
										bindLabel="clientName"
										bindValue="id"
										placeholder="Select Client"
										appendTo="body"
										name="clientName"
										required #clientId="ngModel"
										[(ngModel)]="vehicleConditionForm.clientId"> 
                                    </ng-select>
									<div *ngIf="!clientId?.valid && (clientId?.dirty || clientId?.touched)" class="error">
										<div *ngIf="clientId.errors.required">
											Client is required
										</div>
									</div>
								</div>
							</div> -->
							
						</div>						
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-primary" *ngIf="!isEditMode && !isViewMode" [disabled]="!vehicleConditionMasterForm.valid" data-dismiss="modal" (click)="SaveVehicleCondition()">Save</button>
					<button type="submit" class="btn btn-primary" *ngIf="isEditMode && !isViewMode" [disabled]="!vehicleConditionMasterForm.valid" data-dismiss="modal" (click)="UpdateVehicleCondition()">Update</button>
					<button type="button" class="btn btn-danger" *ngIf="isEditMode && !isViewMode"  data-dismiss="modal" (click)="DeleteVehicleCondition()">Delete</button>
				</div>
			</div>
		</div>
	</form>
</div>
