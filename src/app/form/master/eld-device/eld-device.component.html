
<div class="row">
	<div class="col-lg-12">
		<div class="card">
			<form action="#"> 
				<div class="card-body">
					<div class="btn-group float-sm-right mb-1">
						<button type="button" data-toggle="modal" (click)="ClearForm()" data-target="#device_modal" class="btn btn-outline-success btn-sm">
							<i class="zmdi zmdi-plus mr-1"></i>Add ELD Device
						</button>
					</div> 
					<div class="table-responsive">
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table  table-striped table-hover">
							<thead>
								<tr>
									<th>S.No</th>
									<th>Mac ID</th>
									<th>Serial No.</th>     
									<th>Device No.</th>
									<th>Model</th>
								</tr>
							</thead>
							<tbody>
								<!-- <div id="loading" *ngIf="isLoading">
									<img src="assets/images/pre_lodding.gif" width="250" height="250"  class="text-center">
							   </div> -->
							   <tr *ngFor="let devices of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td><a style="color: dodgerblue; cursor: pointer;" data-toggle="modal" data-target="#device_modal" (click)="EditDevice(devices.deviceId)">{{devices.macId}}</a></td>
								<td>{{devices.serialNo}}</td>     
								<td>{{devices.deviceNo}}</td>
								<td>{{devices.deviceModelName}}</td>
								
							</tr>
							</tbody>
						</table>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>


<div id="device_modal" class="modal fade hide" role="dialog">
    <form action="#" #masterDeviceForm="ngForm" >
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title">ELD Device Details</h6>
					<button type="button" class="close" data-dismiss="modal" >&times;</button>
				</div>
				<div class="modal-body">
					<div class="form-body">
						<div class="row">
							<div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Device No.<i class="validation_required"></i></label>
									<input type="text" id="deviceNo" name="deviceNo" [(ngModel)]="deviceForm.deviceNo" class="form-control form-control-sm" placeholder="Device Number">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="control-label">MAC ID<i class="validation_required">*</i></label>
									<input type="text" name="macId"  id="macId" required #macId="ngModel" class="form-control form-control-sm" [(ngModel)]="deviceForm.macId" placeholder="MAC ID">
								</div>
								<div *ngIf="!macId?.valid && (macId?.dirty || macId?.touched)" class="error">
									<div *ngIf="macId.errors.required">
										MAC ID is required
									</div>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Serial No.<i class="validation_required"></i></label>
									<input type="text" name="serialNo" id="serialNo" [(ngModel)]="deviceForm.serialNo" class="form-control form-control-sm" placeholder="Serial Number">
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Mal Function<i class="validation_required">*</i></label>
									<input type="text" name="malFunction"  id="malFunction" required #malFunction="ngModel" class="form-control form-control-sm" [(ngModel)]="deviceForm.malFunction" placeholder="Mal Function">
								</div>
								<div *ngIf="!malFunction?.valid && (malFunction?.dirty || malFunction?.touched)" class="error">
									<div *ngIf="malFunction.errors.required">
										Mal Function is required
									</div>
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label class="control-label">F/W Version<i class="validation_required">*</i></label>
									<input type="text" name="fwVersion"  id="fwVersion" required #fwVersion="ngModel" class="form-control form-control-sm" [(ngModel)]="deviceForm.fwVersion" placeholder="F/W Version">
								</div>
								<div *ngIf="!fwVersion?.valid && (fwVersion?.dirty || fwVersion?.touched)" class="error">
									<div *ngIf="fwVersion.errors.required">
										F/W Version is required
									</div>
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label for="deviceModalName" class="control-label">Device Modal<i class="validation_required">*</i></label>
									<ng-select [items]="deviceModalNameDataArr"
                                        bindLabel="deviceModalName"
                                        bindValue="id"
                                        placeholder="Select Device Modal"
                                        appendTo="body"
                                        name="deviceModalName"
										required #deviceModelId="ngModel"
                                        [(ngModel)]="deviceForm.deviceModelId"> 
                                    </ng-select>				
									<div *ngIf="!deviceModelId?.valid && (deviceModelId?.dirty || deviceModelId?.touched)" class="error">
										<div *ngIf="deviceModelId.errors.required">
											Device Modal is required
										</div>
									</div>
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Billing Date<i class="validation_required"></i></label>
									<input type="date" name="billingDate"  id="billingDate" [(ngModel)]="deviceForm.billingDate" class="form-control form-control-sm" >
								</div>
							</div>

							<div class="col-md-4">
								<div class="form-group">
									<label for="paymentStatusName" class="control-label">Warranty<i class="validation_required"></i></label>
									<ng-select [items]="warrantyDataArr"
                                        bindLabel="warranty"
                                        bindValue="id"
                                        placeholder="Select Warranty"
                                        (change)="GetWarrantyDate($event.id)"
                                        appendTo="body"
                                        name="warranty"
                                        [(ngModel)]="deviceForm.warrantyValue"> 
                                    </ng-select>
                                    
								</div>
							</div>

							<div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Warranty From Date<i class="validation_required"></i></label>
									<input type="date" name="warrantyFromDate" id="warrantyFromDate" [(ngModel)]="deviceForm.warrantyFromDate" class="form-control form-control-sm" >
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Warranty To Date<i class="validation_required"></i></label>
									<input type="date" name="warrantyToDate" id="warrantyToDate" [(ngModel)]="deviceForm.warrantyToDate" class="form-control form-control-sm" >
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label for="vehicleNo" class="control-label">Vehicle No<i class="validation_required">*</i></label>
									<ng-select 
										[items]="vehicleDataArr"
										bindLabel="vehicleNo"
										bindValue="id"
										placeholder="Select Vehicle"
										appendTo="body"
										name="vehicleNo"
										required #vehicleId="ngModel"
										[(ngModel)]="deviceForm.vehicleId"> 
                                    </ng-select>
									<div *ngIf="!vehicleId?.valid && (vehicleId?.dirty || vehicleId?.touched)" class="error">
										<div *ngIf="vehicleId.errors.required">
											Vehicle is required
										</div>
									</div>
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label for="clientName" class="control-label">Client<i class="validation_required">*</i></label>
									<ng-select 
										[items]="clientDataArr"
										bindLabel="clientName"
										bindValue="id"
										placeholder="Select Client"
										appendTo="body"
										name="clientName"
										required #clientId="ngModel"
										[(ngModel)]="deviceForm.clientId"> 
                                    </ng-select>
									<div *ngIf="!clientId?.valid && (clientId?.dirty || clientId?.touched)" class="error">
										<div *ngIf="clientId.errors.required">
											Client is required
										</div>
									</div>
								</div>
							</div>

                            <div class="col-md-4">
								<div class="form-group">
									<label class="control-label">Status<i class="validation_required"></i></label>
									<div>
										<label class="switch btn btn-info btn-sm">
											<input type="checkbox" id="status" name="status" [(ngModel)]="deviceForm.status" >
											<span class="slider"></span>
										</label>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="reset" class="btn btn-danger" data-dismiss="modal" >Cancel</button>
					<button type="submit" class="btn btn-primary" *ngIf="!isEditMode && !isViewMode" [disabled]="!masterDeviceForm.valid" data-dismiss="modal" (click)="SaveDevices()">Save</button>
					<button type="submit" class="btn btn-primary" *ngIf="isEditMode && !isViewMode" [disabled]="!masterDeviceForm.valid" data-dismiss="modal" (click)="UpdateDevices()">Update</button>
					<button type="button" class="btn btn-danger" *ngIf="isEditMode && !isViewMode"  data-dismiss="modal" (click)="DeleteDevices()">Delete</button>
				</div>
			</div>
		</div>
	</form>
</div>
