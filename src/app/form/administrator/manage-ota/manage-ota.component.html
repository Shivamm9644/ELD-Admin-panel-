
<div class="row">
	<div class="col-lg-12">
		<div class="card">
			<form action="#"> 
				<div class="card-body">
					<div class="float-sm-left mb-3 mt-3"><h4>Manage OTA</h4></div>
					<div class="btn-group float-sm-right mb-3 mt-3">
						<button type="button" data-toggle="modal" data-target="#ota_modal" class="btn btn-outline-success btn-sm">
							<i class="zmdi zmdi-plus mr-1"></i>Add OTA
						</button>
					</div>
					<div class="table-responsive">
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
							<thead>
								<tr>
									<th>S.No</th>
									<th>Hardware Version</th>
									<th>Firmware Version</th>
									<th>Ota Url</th> 
                                    <th>process Ota</th>
                                    <th>firmware File Name</th>
                                    <th>Date Time</th>
								</tr>
							</thead>
							<tbody>
							   <tr *ngFor="let ota of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td>{{ota.hardwareVersion}}</td>
                                <td>{{ota.firmwareVersion}}</td> 
                                 <td>{{ota.otaUrl}}</td> 
                                <td>{{ota.processOta}}</td>
                                <!-- <td>{{ota.firmwareFileName}}</td> -->
								<td><a style="color: dodgerblue; cursor: pointer;" (click)="openDocument(ota.firmwareFileName)">view</a>
                                <td>{{ota.addedTimestamp | date:'MM/dd/yyyy HH:mm:ss'}}</td>
							</tr>
							</tbody>
						</table>
						<div class="pre_lodding" *ngIf="isLoading">
							<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
						</div>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>
<div id="ota_modal" class="modal fade hide" role="dialog">
    <form action="#" [formGroup]="otaForm" enctype="multipart/form-data" id="otaActivityForm">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title">OTA Add</h6>
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
				<div class="modal-body">
					<div class="form-body">
						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">Hardware Version<i class="validation_required"></i></label>
									<input type="text" id="hardwareVersion" name="hardwareVersion"  #hardwareVersion="ngModel"  class="form-control form-control-sm" [(ngModel)]="otaForm.hardwareVersion" placeholder="hardware Version">
								</div>
								<!-- <div *ngIf="!countryCode?.valid && (countryCode?.dirty || countryCode?.touched)" class="error">
									<div *ngIf="countryCode.errors.required">
										Country code is  required
									</div>
								</div> -->
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="control-label">FirmWare Version<i class="validation_required"></i></label>
									<input type="text" id="firmwareVersion" name="firmwareVersion"  #firmwareVersion="ngModel"  class="form-control form-control-sm" [(ngModel)]="otaForm.firmwareVersion" placeholder="firmware Version">
								</div>
								<!-- <div *ngIf="!countryName?.valid && (countryName?.dirty || countryName?.touched)" class="error">
									<div *ngIf="countryName.errors.required">
										country Name is  required
									</div>
								</div> -->
							</div>

                            <div class="col-md-6">
								<div class="form-group">
									<label class="control-label">OTA URl<i class="validation_required"></i></label>
									<input type="text" id="otaUrl" name="otaUrl"  #otaUrl="ngModel"  class="form-control form-control-sm" [(ngModel)]="otaForm.otaUrl" placeholder="ota Url">
								</div>
							</div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label">Select File</label>
                                    <input type="file" id="selectFile" name="selectFile"  accept=".bin" (change)="selectFile($event)" class="form-control">
                                </div>
                            </div>


                            <div class="col-md-6">
                                <div class="form-check mt-4 ml-2">
                                    <input type="checkbox" id="processOta" name="processOta" [(ngModel)]="otaForm.processOta">
                                    <small class="control-label" style="padding-left: 10px;">OTA Process<i class="validation_required"></i></small>
                                </div>
                            </div>
							
						</div>						
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-primary"  data-dismiss="modal" (click)="SaveOta()">Save</button>

                  <!-- <button type="button" class="btn btn-danger" *ngIf="isEditMode && !isViewMode"  data-dismiss="modal" (click)="DeleteCountry()">Delete</button> -->
				</div>
			</div>
		</div>
	</form>
</div>
