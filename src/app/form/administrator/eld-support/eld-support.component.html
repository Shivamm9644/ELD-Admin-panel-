
<div class="row pt-2 pb-2">
	<div class="col-sm-9">
		<h4 class="page-title">ELD Support</h4>
	</div>
</div>
<div class="row">
	<div class="col-lg-12">
		<div class="card">
			<form action="#" #eldSupportForm="ngForm"> 
			<div class="card-body">
				<div class="row p-t-20 pl-3"> 
					<div class="col-md-3">
                        <div class="form-group">
                             <label class="control-label">From Date</label>
                            <input type="date" id="fromDate" name="fromDate" class="form-control">
                         </div> 
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                             <label class="control-label">To Date</label>
                            <input type="date" id="toDate" name="toDate" class="form-control">
                         </div>
                    </div>
                    <div class="col-md-3">
                        <label class="control-label">Driver</label>
                        <ng-select [items]="driverDataArr"
                            bindLabel="employeeName"
                            bindValue="id"
                            placeholder="Select Driver"
                            appendTo="body"
                            name="employeeName"
                            [(ngModel)]="supportForm.driverId"> 
                        </ng-select>
                    </div>
                    <div style="margin-top: 30px;"  class="col-md-2">
                        <button type="button" class="btn btn-outline-info" (click)="ViewELDSupport()">Submit</button>
                    </div>
                </div>
				<div class="table-responsive">
					<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
						<thead>
							<tr>
								<th>S.No</th>
								<th>Driver</th>  
								<th>Truck</th>  
								<th>Company</th>  
								<th>Date Time</th>  
                                <th style="white-space: normal !important;">Message</th>  
                                <th>Status</th>
							</tr>
						</thead>
						<tbody>
						   <tr *ngFor="let otaLog of rowData; let i = index">
							<th style="text-align: center;" scope="row">{{i+1}}</th>
							<td>{{otaLog.driverName}}</td>
							<td>{{otaLog.vehicleNo}}</td>
							<td>{{otaLog.companyName}}</td>
							<td>{{otaLog.utcDateTime | date:'MM/dd/yyyy HH:mm:ss'}}</td>
                            <td>{{otaLog.message}}</td>
                            <td><a style="color: dodgerblue; cursor: pointer;" data-toggle="modal" data-target="#eld_support_modal" (click)="ShowELDSupport(otaLog)">{{otaLog.status}}</a></td>
						</tr>
						</tbody>
					</table>
					<div class="pre_lodding" *ngIf="isLoading">
						<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
					</div>
				</div>
			 </div>
		  </form>
		</div>
	</div>
</div>

<div id="eld_support_modal" class="modal fade hide" role="dialog">
    <form action="#" #eldSupportModalForm="ngForm">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title">ELD Support Information</h6>
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
				<div class="modal-body">
					<div class="form-body">
						<div class="row">
							<div class="col-md-12">
								<div class="form-group">
									<label class="control-label">Remark<i class="validation_required">*</i></label>
                                    <textarea id="remark" name="remark" class="form-control form-control-sm" rows="4" cols="50"></textarea>
								</div>
							</div>
						</div>						
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger"  data-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-primary" [disabled]="!eldSupportModalForm.valid" data-dismiss="modal" (click)="UpdateELDSupport()">Update</button>

				</div>
			</div>
		</div>
	</form>
</div>
