<div class="row">
	<div class="col-lg-12">
		<div class="card p-3 mb-2">
			<form action="#"> 
				<div class="d-flex justify-content-between ">
					<h6 class="card-title h5">Maintenance History</h6>
					<div class="d-flex">
						<button class="btn btn-outline-success btn-sm mx-2"><small>Add Event</small><i class="zmdi zmdi-plus ml-2"></i></button>
                        <!-- <button class="btn btn-outline-dark btn-sm mx-3"><small>Copy Reminder</small></button> -->
                        <button class="btn btn-outline-dark btn-sm"><small>Refresh</small><i class="zmdi zmdi-refresh ml-2"></i></button>
					</div>
				</div>
                <div class="d-flex my-3">
                    <div class="form-group">
                        <input type="date" class="form-control form-control-sm" placeholder="Start Date">
                    </div>
                    <div class="form-group mx-2">
                        <input type="date" class="form-control form-control-sm" placeholder="End Date">
                    </div>
                    <ng-select placeholder="All Vehicles"></ng-select>
                    <ng-select placeholder="Date (desc.)" class="mx-2"></ng-select>
                </div>
				<div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr class="bg-light text-dark">
                                    <!-- <th><input type="checkbox" value=""  id=""></th> -->
                                    <th>Date Completed</th>
                                    <th>Vehicle</th>
                                    <th>Service Type</th>
                                    <th>Odometer</th>
                                    <th>Engine Hours</th>
                                    <th>Cost</th>
                                    <th>Notes</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                   
                                    <th>Date Completed</th>
                                    <th>Vehicle</th>
                                    <th>Service Type</th>
                                    <th>Odometer</th>
                                    <th>Engine Hours</th>
                                    <th>Cost</th>
                                    <th>Notes</th>
                                    <td><input type="checkbox" value=""  id=""></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
				</div>
		   </form>
		</div>
	</div>
</div>
