<div class="row">
	<div class="col-lg-12">
		<div class="card p-2">
			<form action="#"> 
				<div class="card-body">
					<div class="d-flex justify-content-between mb-3">
                        <span class="card-title h5 m-0">Log Data</span>
                    </div>
                    <div class="d-flex my-2">
                        <div class="form-group">
                            <input type="date" class="form-control form-control-sm" id="fromDate" aria-describedby="" placeholder="From Date">
                        </div>
                        <div class="form-group mx-3">
                            <input type="date" class="form-control form-control-sm" id="toDate" aria-describedby="" placeholder="To Date">
                        </div> 
                        <ng-select [items]="vehicleDataArr"
                            bindLabel="vehicleNo"
                            bindValue="id"
                            placeholder="All vehicles"
                            appendTo="body"
                            name="vehicleNo"
                            [(ngModel)]="eldForm.vehicleId"> 
                        </ng-select>

                        <button type="submit" class="btn btn-primary ml-2" (click)="ELDLogDataReport()">Submit</button>

                    </div>
					<div class="table-responsive">
                        <!-- <div id="loading" *ngIf="isLoading">
                            <img src="assets/images/pre_loading11.gif" width="250" height="250"  class="text-center">
                        </div> -->
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
							<thead>
								<tr>
									<th>Sr. No.</th>
									<th>Driver</th>
									<th>Vehicle</th>
									<th>MAC</th>     
									<th>Odometer</th>
									<th>Lat Lng</th>
									<th>Address</th>
									<th>State</th>
                                    <th>Date Time</th>
                                </tr>
							</thead>
							<tbody> 
								
							   <tr *ngFor="let eld of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td>{{eld.DriverName}} </td>
								<td>{{eld.VehicleName}} </td>
								<td>{{eld.MAC}} </td>
								<td>{{eld.Odometer}} </td>
								<td>{{eld.Lattitude}} / {{eld.Longitude}}</td>
                                <td>{{eld.PlaceAddress}} </td>
								<td>{{eld.stateName}} ({{eld.stateCode}})</td>
                                <td>{{eld.DateTime}} </td>
							</tr>
							</tbody>
						</table>
						<div class="pre_lodding" *ngIf="isLoading">
							<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
						</div>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>
