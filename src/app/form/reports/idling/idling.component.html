<div class="row">
  <div class="col-lg-12">
    <div class="card p-3 mb-2">
      <form #idleFormRef="ngForm" (ngSubmit)="GenerateIdleReport()">

        <div class="d-flex justify-content-between">
          <h6 class="card-title h5">Idling Reports</h6>
          <div class="d-flex">
            <button type="button" (click)="RefreshPage()" class="btn btn-outline-dark btn-sm">
              <small>Refresh</small><i class="zmdi zmdi-refresh ml-2"></i>
            </button>
          </div>
        </div>

        <div class="card-body">

          <!-- From Date -->
          <div class="row my-2">
            <div class="col-md-12 mb-2 row">
              <label class="col-3 col-form-label">From Date</label>
              <div class="col-9">
                <input type="date" 
                       id="fromDate" 
                       name="fromDate" 
                       class="form-control form-control-sm" 
                       placeholder="Start Date"
                       [(ngModel)]="idleForm.fromDate" 
                       #fromDate="ngModel" 
                       required
                       onfocus="this.showPicker()" />

                <div *ngIf="fromDate.invalid && (fromDate.dirty || fromDate.touched)" class="text-danger small">
                  Please select From Date.
                </div>
              </div>
            </div>

            <!-- To Date -->
            <div class="col-md-12 row">
              <label class="col-3 col-form-label">To Date</label>
              <div class="col-9">
                <input type="date" 
                       id="toDate" 
                       name="toDate" 
                       class="form-control form-control-sm" 
                       placeholder="End Date"
                       [(ngModel)]="idleForm.toDate" 
                       #toDate="ngModel" 
                       required
                       onfocus="this.showPicker()" />

                <div *ngIf="toDate.invalid && (toDate.dirty || toDate.touched)" class="text-danger small">
                  Please select To Date.
                </div>
              </div>
            </div>
          </div>

          <!-- Vehicle -->
          <div class="row mb-3">
            <div class="col-md-12 mb-2 row">
              <label class="col-3 col-form-label">Vehicle(s)</label>
              <div class="col-9">
                <ng-select [items]="vehicleDataArr" 
                           bindLabel="vehicleNo" 
                           bindValue="id"
                           placeholder="Select Vehicle" 
                           appendTo="body"
                           name="vehicleId" 
                           [(ngModel)]="idleForm.vehicleId" 
                           #vehicleId="ngModel" 
                           required
                           (change)="GetDeviceName($event.vehicleNo,$event.id)">
                </ng-select>

                <div *ngIf="vehicleId.invalid && (vehicleId.dirty || vehicleId.touched)" class="text-danger small">
                  Please select a vehicle.
                </div>
              </div>
            </div>

            <!-- Output Format -->
            <div class="col-md-12 row">
              <label class="col-3 col-form-label">Output Format</label>
              <div class="col-9">
                <ng-select [items]="exportOptions" 
                           bindLabel="label" 
                           bindValue="value" 
                           [(ngModel)]="selectedFormat" 
                           [ngModelOptions]="{standalone: true}"
                           placeholder="Select format">
                </ng-select>
              </div>
            </div>
          </div>

          <!-- Generate Button -->
          <div class="row mb-3 justify-content-center">
            <div>
              <button type="submit" 
                      class="btn btn-success btn-sm px-4"
                      [disabled]="idleFormRef.invalid">
                Generate
              </button>
            </div>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
