<div class="row">
	<div class="col-lg-12">
		<div class="card p-2">
			<form action="#"> 
				<div class="card-body">
					<div class="d-flex justify-content-between mb-3">
                        <span class="card-title h5 m-0">Login Log</span>
                    </div>
                    <div class="row my-2">
						<div class="col-md-2">
							<div class="form-group">
								<input type="date" class="form-control form-control-sm" id="fromDate" aria-describedby="" placeholder="From Date">
							</div>
						</div>
						<div class="col-md-2">
							<div class="form-group mx-3">
								<input type="date" class="form-control form-control-sm" id="toDate" aria-describedby="" placeholder="To Date">
							</div> 
						</div>
						<div class="col-md-3">
							<ng-select [items]="userDataArr"
								bindLabel="userName"
								bindValue="id"
								placeholder="Select User"
								appendTo="body"
								name="userName"
								[(ngModel)]="llForm.userId"> 
							</ng-select>
						</div>
                        <div class="col-md-2">
							<button type="submit" class="btn btn-primary ml-2" (click)="LoginLogReport()">Submit</button>
						</div>
                        
                    </div>
					<div class="table-responsive">
                        <!-- <div id="loading" *ngIf="isLoading">
                            <img src="assets/images/pre_loading11.gif" width="250" height="250"  class="text-center">
                        </div> -->
						<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-striped table-hover">
							<thead>
								<tr>
									<th>Sr. No.</th>
									<th>Driver</th>
									<th>Email</th>
									<th>Mobile No.</th>     
									<th>Login Time</th>
									<th>Logout Time</th>
                                </tr>
							</thead>
							<tbody> 
							   <tr *ngFor="let llData of rowData; let i = index">
								<th style="text-align: center;" scope="row">{{i+1}}</th>
								<td>{{llData.firstName}} {{llData.lastName}} </td>
								<td>{{llData.email}} </td>
								<td>{{llData.mobileNo}} </td>
								<td>{{llData.loginDateTime | date:'yyyy-MM-dd HH:mm:ss'}} </td>
                                <td>
                                    <span *ngIf="llData.logoutDateTime==0"></span>
                                    <span *ngIf="llData.logoutDateTime!=0">{{llData.logoutDateTime | date:'yyyy-MM-dd HH:mm:ss'}} </span>
                                </td>
							</tr>
							</tbody>
						</table>
						<div class="pre_lodding" *ngIf="isLoading">
							<img src="../../../../assets/images/loading.gif" alt="" srcset="" class="m-auto img-fluid" width="150">
						</div>
					</div>
				</div>
		   </form>
		</div>
	</div>
</div>
